name: ci

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  branch-policy:
    runs-on: ubuntu-latest
    steps:
      - name: 核对 main 来源和同一提交的线上验证
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr || pr.base.ref !== 'main') return;
            if (pr.head.ref !== 'dev' || pr.head.repo.full_name !== context.payload.repository.full_name) {
              core.setFailed('main 仅接收本仓库 dev 分支的 PR。');
              return;
            }
            const deployments = await github.paginate(github.rest.repos.listDeployments, {
              ...context.repo, ref: pr.head.sha, environment: 'production-dev', per_page: 100,
            });
            for (const deployment of deployments) {
              if (deployment.sha !== pr.head.sha) continue;
              const statuses = await github.rest.repos.listDeploymentStatuses({
                ...context.repo, deployment_id: deployment.id, per_page: 1,
              });
              if (statuses.data[0]?.state === 'success') {
                core.notice(`dev 提交 ${pr.head.sha} 已完成线上验证，deployment #${deployment.id}。`);
                return;
              }
            }
            core.setFailed('该 dev 提交尚无 production-dev 成功部署记录；先部署并验收，再合入 main。');

  reporter-regression:
    needs: branch-policy
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: artex_test
          POSTGRES_PASSWORD: artex_test
          POSTGRES_DB: artex_reporter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U artex_test -d artex_reporter_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ARTEX_PG_DSN: postgres://artex_test:artex_test@127.0.0.1:5432/artex_reporter_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: 预编译报告回归测试
        run: go test ./server -run '^$' -timeout 60s
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 本地 Agent 设备与真实 CLI 业务回归
        run: ARTEX_LOCAL_AGENT_TEST_DSN="$ARTEX_PG_DSN" timeout 60s go test ./server -run '^TestLocalAgent' -count=1 -timeout 60s
      - name: 报告触发及真实写回回归
        run: >-
          timeout 60s go test ./server
          -run '^(TestTriggeredRunUsesAgentBoundProfileWithoutGlobalChatAgent|TestReporterSavesReportAfterStartupProxyRecovers|TestToolTriggerRetriesUnavailableAgentWithoutDuplicatingOtherTriggers)$'
          -count=1 -timeout 60s
      - name: 默认对话配置恢复回归
        run: >-
          timeout 60s go test ./server
          -run '^(TestChatDefault|TestLLMGlobalConversationUsesPoolSelectionAndFailover|TestResolveChatAgentHonoursConversationProfile|TestChatUnavailableReasonDistinguishesStates)'
          -count=1 -timeout 60s
      - name: 技能与记录引用和 Worker 发送回归
        run: timeout 60s go test ./server -run '^(TestChatMention|TestChatSkillMention)' -count=1 -timeout 60s
      - name: 在线目录安装、绑定与回滚回归
        run: |
          timeout 60s go test ./db ./server -run '^TestCatalog' -count=1 -timeout 60s
      - name: Agent 绑定计数与工具空绑定回归
        run: timeout 60s go test ./db ./server -run '^(TestAgentBindingCounts|TestToolWrites|TestAgentListBindingCount)' -count=1 -timeout 60s
      - name: FOFA 配置、工具和内置 Skill 回归
        run: |
          timeout 60s go test ./integrations/fofa ./skills -count=1 -timeout 60s
          timeout 60s go test ./db -run '^TestFOFA' -count=1 -timeout 60s
          timeout 60s go test ./server -run '^(TestFOFA|TestBuiltinFOFASkill|TestProxyJSONOptionalConstraints|TestProxyToolsStrictArguments)' -count=1 -timeout 60s
          cd norma
          timeout 60s go test ./tool ./agentcore -run '^(TestSearchExtraTools|TestNativeToolDiscoveryKeepsDirectSchemaAndExecutionBoundary|TestExecuteExtraTool|TestDeferred)' -count=1 -timeout 60s
      - name: 重启恢复及出口引用回归
        run: |
          timeout 60s go test ./server -run '^(TestPlannerPGRestart|TestPlannerPGUnavailableResolver|TestPlannerPGProxyRecovers|TestPlannerPGLeaseRecovery|TestPlannerPGRetryHonors|TestPlannerPGGracefulRestart|TestServerShutdown)' -count=1 -timeout 60s
          timeout 60s go test ./db -run '^(TestTaskActivityRecoveryReleasesOnlyOwnedWarpTokens|TestPlannerRun)' -count=1 -timeout 60s
      - name: 浏览器清理重试与 Planner 自动续跑回归
        run: |
          timeout 60s go test ./agent -run '^(TestPlannerBrowserCleanupRetry|TestBrowserCleanup)' -count=1 -timeout 60s
          timeout 60s go test ./server -run '^TestPlannerPGPendingCleanupAutomaticallyReplansAfterTrueExit$' -count=1 -timeout 60s
      - name: 待领队列防饥饿和 Worker 等待超时回归
        run: |
          timeout 60s go test ./db -run '^(TestFrontierAging|TestExplorationFlow)' -count=1 -timeout 60s
          timeout 60s go test ./agent -run '^(TestWorker(HardDeadline|SoftBudget|Unlimited)|TestTerminalText)' -count=1 -timeout 60s
          timeout 60s go test ./server -run '^(TestWorkerPGHardTimeout|TestWorkerModelTimeoutDoesNotReplayIntent)' -count=1 -timeout 60s
          cd norma
          timeout 60s go test ./harness -run '^(TestConsumerStop|TestUnlimited|TestHard|TestSettlementOnToolOverrunsBudget|TestParentCancelStillAbortsNoSettlement)' -count=1 -timeout 60s
      - name: 目标证明和任务完成门禁回归
        run: |
          timeout 60s go test ./db -run '^(TestCompleteTaskIfIdle|TestGoalProof|TestFlagAcquisition|TestPositiveFlag|TestProveGoal)' -count=1 -timeout 60s
          timeout 60s go test ./agent -run '^(TestProveGoal|TestFlagGoal|TestRenderSystemOverride)' -count=1 -timeout 60s
          timeout 60s go test ./server -run '^(TestGoallessFailedIntent|TestMetGoalAllows|TestOpenGoalWithFailedIntent|TestInvalidMetFlagGoal|TestFlagEvidenceSchema)' -count=1 -timeout 60s
      - name: 容器退出证明与维护入口回归
        env:
          ARTEX_WARP_HEALTH_TEST_DSN: postgres://artex_test:artex_test@127.0.0.1:5432/artex_warp_container_exit_test?sslmode=disable
        run: |
          timeout 60s go test ./server -run '^TestWarpContainerExit' -count=1 -timeout 60s
          timeout 60s go test ./maintenance ./egress ./cmd/artex-warp-recovery -count=1 -timeout 60s
      - name: 全局 WARP 策略与后台安全恢复回归
        env:
          ARTEX_WARP_HEALTH_TEST_DSN: postgres://artex_test:artex_test@127.0.0.1:5432/artex_warp_health_test?sslmode=disable
        run: |
          psql "$ARTEX_PG_DSN" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE artex_warp_health_test'
          timeout 60s go test ./db -run '^(TestGlobalWarp|TestWarpHealth)' -count=1 -timeout 60s
          timeout 60s go test ./server -run '^(TestGlobalWarpHealthPolicyHTTP|TestWarpHealthController|TestWarpHealthDTO)' -count=1 -timeout 60s

  checks:
    needs: branch-policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: 全仓编译
        run: go test ./... -run '^$' -timeout 60s
      - name: 更新和生命周期定向回归
        run: |
          timeout 60s go test ./selfupdate ./config ./cmd/artex -count=1 -timeout 60s
          timeout 60s go test ./server -run '^(TestReleaseCache|TestUpdateOffer|TestUpdateStatus|TestWorkspaceProtects|TestPauseCancelsWithNamedCause|TestResumeYieldsFreshContext|TestResumeDoesNotClearDeleteBarrier)' -count=1 -timeout 60s
      - name: 技能打包下载与上传往返回归
        run: timeout 60s go test ./server -run '^(TestDownloadSkill|TestUploadSkill|TestSkillRelPath|TestValidSkillName)' -count=1 -timeout 60s
      - name: 技能清单共享解析回归
        working-directory: norma
        run: timeout 60s go test ./skill -count=1 -timeout 60s
      - name: 仓库目录源与文件校验回归
        run: timeout 60s go test ./catalog -count=1 -timeout 60s
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 在线目录文件摘要校验
        run: node scripts/check-catalog.mjs
      - name: 本地 Agent 客户端与 Skill 同步校验
        run: node --test --test-timeout=60000 scripts/artex-agent.test.mjs
      - run: npm ci --ignore-scripts
        working-directory: web
      - name: 前端类型和更新流程
        working-directory: web
        run: |
          npx tsc --noEmit
          timeout 60s node --import ./scripts/test-api-loader.mjs --test --test-timeout=60000 src/lib/catalog-api.test.mjs
          timeout 60s node --import ./scripts/test-api-loader.mjs --test --test-timeout=60000 src/lib/warp-health-api.test.mjs src/lib/proxy-center.test.mjs src/lib/warp-create-intent.test.mjs src/lib/warp-create-api.test.mjs src/lib/proxy-warp-register.test.mjs
          timeout 60s node --import ./scripts/test-api-loader.mjs --test --test-timeout=60000 src/lib/update-flow.test.mjs src/lib/update-api.test.mjs src/lib/fofa-settings.test.mjs src/lib/skill-download-api.test.mjs src/lib/chat-mentions.test.mjs src/lib/chat-mentions-api.test.mjs
